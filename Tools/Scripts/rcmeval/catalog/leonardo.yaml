datasets:
  CHIRPS:
    root: /leonardo_work/ICT26_ESP/OBS/CHIRPS
    frequency: mon
    surface: land
    variables:
      pr:
        file: chirps-v3.0.{year}.monthly.nc
        name: precip
        per_day: true
  CPC:
    root: /leonardo_work/ICT26_ESP/OBS/CPC/precip
    frequency: day
    surface: land
    variables:
      pr:
        file: precip.{year}.nc
        name: precip
  CRU:
    root: /leonardo_work/ICT26_ESP/OBS/CRU
    frequency: mon
    surface: land
    variables:
      pr:
        file: pre.dat.nc
        name: pre
        per_day: true
      tas:
        file: tmp.dat.nc
        name: tmp
      clt:
        file: cld.dat.nc
        name: cld
  EOBS:
    root: /leonardo_work/ICT26_ESP/OBS/EOBS/010
    frequency: day
    surface: land
    variables:
      pr:
        file: rr_ens_mean_0.1deg_reg_v32.0e.nc
        name: rr
      tas:
        file: tg_ens_mean_0.1deg_reg_v32.0e.nc
        name: tg
  ERA5:
    root: /leonardo_work/ICT26_ESP/OBS/ERA5/monthly
    frequency: mon
    variables:
      pr:
        file: '{year}/pr_{year}_{month:02d}.nc'
        name: tp
        factor: 1000.0
      evspsbl:
        file: '{year}/evp_{year}_{month:02d}.nc'
        name: e
        factor: -1000.0
      tas:
        file: '{year}/tas_{year}_{month:02d}.nc'
        name: t2m
        offset: -273.15
      psl:
        file: '{year}/psl_{year}_{month:02d}.nc'
        name: msl
        factor: 0.01
      clt:
        file: '{year}/clt_{year}_{month:02d}.nc'
        name: tcc
        factor: 100.0
      cll:
        file: '{year}/cll_{year}_{month:02d}.nc'
        name: lcc
        factor: 100.0
      clm:
        file: '{year}/clm_{year}_{month:02d}.nc'
        name: mcc
        factor: 100.0
      clh:
        file: '{year}/clh_{year}_{month:02d}.nc'
        name: hcc
        factor: 100.0
      clwvi:
        file: '{year}/clwvi_{year}_{month:02d}.nc'
        name: tclw
        factor: 1000.0
      clivi:
        file: '{year}/clivi_{year}_{month:02d}.nc'
        name: tciw
        factor: 1000.0
      hfls:
        file: '{year}/lflx_{year}_{month:02d}.nc'
        name: slhf
        factor: -1.1574074e-05
      hfss:
        file: '{year}/sflx_{year}_{month:02d}.nc'
        name: ishf
        factor: -1.0
      rlut:
        file: '{year}/toanetlw_{year}_{month:02d}.nc'
        name: ttr
        factor: -1.1574074e-05
      rsdt:
        file: '{year}/toainsw_{year}_{month:02d}.nc'
        name: tisr
        factor: 1.1574074e-05
      ta:
        file: '{year}/tatm_{year}_{month:02d}.nc'
        name: t
        levels: true
      hus:
        file: '{year}/qhum_{year}_{month:02d}.nc'
        name: q
        factor: 1000.0
        levels: true
      hur:
        file: '{year}/rhum_{year}_{month:02d}.nc'
        name: r
        levels: true
      ua:
        file: '{year}/uwnd_{year}_{month:02d}.nc'
        name: u
        levels: true
      va:
        file: '{year}/vwnd_{year}_{month:02d}.nc'
        name: v
        levels: true
      wap:
        file: '{year}/wwnd_{year}_{month:02d}.nc'
        name: w
        levels: true
  GPCP:
    root: /leonardo_work/ICT26_ESP/OBS/GPCP/monthly
    frequency: mon
    variables:
      pr:
        file: GPCPMON_L3_{year}_V3.2.nc4
        name: sat_gauge_precip
  MSWEP:
    root: /leonardo_work/ICT26_ESP/OBS/MSWEP/monthly
    frequency: mon
    variables:
      pr:
        file: '{year}{month:02d}.nc'
        name: precipitation
        per_day: true
  MSWEP_DAY:
    root: /leonardo_work/ICT26_ESP/OBS/MSWEP/daily
    frequency: day
    variables:
      pr:
        file: '{year}.nc'
        name: precipitation
